name: MiCRM
options:
  bundleIdPrefix: com.microimage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # set your Apple Developer team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  MiCRM:
    type: application
    platform: iOS
    sources:
      - path: MiCRM
    info:
      path: MiCRM/Resources/Info.plist
      properties:
        CFBundleDisplayName: MiCRM
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # The on-premise server (10.20.20.2:8001) is plain HTTP on the office
        # LAN. Public traffic to micrm.microimageph.com stays on TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.microimage.crm
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
