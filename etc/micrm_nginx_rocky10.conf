# ---------------------------------------------------------------------------
# MIIC CRM - nginx site config for Rocky Linux 10 (nginx 1.26, SELinux)
# ---------------------------------------------------------------------------
# Install as:  /etc/nginx/conf.d/micrm.conf
# Test with:   sudo nginx -t
# Reload with: sudo systemctl reload nginx
#
# This file is pulled in from http{} by "include /etc/nginx/conf.d/*.conf;"
# in the stock /etc/nginx/nginx.conf, so do NOT add http{} or events{} here.
#
# ===========================================================================
# REQUIRED SETUP - WHY THE OLD FILE FAILED "nginx -t" ON ROCKY 10
# ===========================================================================
# Rocky/RHEL ship /etc/nginx/nginx.conf WITH a default server already defined:
#
#     server {
#         listen       80 default_server;
#         listen       [::]:80 default_server;
#         server_name  _;
#         root         /usr/share/nginx/html;
#     }
#
# Only ONE default_server is allowed per address:port, so that stock block
# collides with the catch-all below and nginx refuses the config with:
#
#     nginx: [emerg] a duplicate default server for 0.0.0.0:80
#
# Debian/Ubuntu do not have this block (its equivalent lives in
# sites-enabled/default), which is why the same file worked there.
#
# FIX: comment out that stock "server { ... }" block in
# /etc/nginx/nginx.conf, leave the "include /etc/nginx/conf.d/*.conf;" line
# alone, then re-run "sudo nginx -t".
#
# If you would rather NOT edit nginx.conf, delete the catch-all block at the
# top below and remove "default_server" from it - but then unknown hostnames
# fall through to the stock nginx welcome page instead of being dropped.
# ===========================================================================

# ---------------------------------------------------------------------------
# Catch-all: drop anything that is not our hostname
# ---------------------------------------------------------------------------
# Keeps scanners and IP-only probes away from the app. ssl_reject_handshake
# needs nginx >= 1.19.4 (Rocky 10 has 1.26) and is what allows this block to
# run with NO certificate: the TLS handshake is refused before a certificate
# would have to be chosen.
#
# NOTE: the IPv6 listeners MUST repeat "ssl". The old file had
# "listen [::]:443 default_server;" without it, which made the IPv6 socket a
# plain-HTTP listener on the HTTPS port.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_reject_handshake on;

    return 444;   # close the connection without sending a response
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name micrm.microimageph.com;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # nginx >= 1.25.1 deprecated "listen ... http2". On 1.26 the old form still
    # "works" but prints a warning, so HTTP/2 is enabled with its own directive.
    http2 on;

    server_name micrm.microimageph.com;
    root /var/www/mi_crm;

    # Max upload size. Must be >= Django's DATA_UPLOAD_MAX_MEMORY_SIZE so large
    # shared files (e.g. the company-wide Android APK) can be uploaded. Without
    # this, nginx rejects bodies over its 1 MB default with HTTP 413 before the
    # request reaches the app.
    client_max_body_size 150M;

    # ---- SSL ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/micrm.microimageph.com/fullchain.pem;  # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/micrm.microimageph.com/privkey.pem;    # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ---- Security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:;" always;

    # Was "Permission-Policy" - the real header name is plural "Permissions-Policy".
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Django admin, restricted to internal networks ---------------------
    # NOTE: the standard proxy headers are repeated in every proxying location
    # below on purpose. nginx does NOT merge them - once a location defines any
    # proxy_set_header, it stops inheriting the outer ones - so a location that
    # only sets the WebSocket headers (like /ws/) would silently lose Host and
    # X-Forwarded-*. Repeating them keeps the file self-contained (no extra
    # proxy_params snippet to install) and avoids that bug.
    location /admin {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        # Must proxy to the app, otherwise allowed requests 404.
        proxy_pass http://unix:/run/gunicorn.sock;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ---- Static files ------------------------------------------------------
    location /static/ {
        alias /var/www/mi_crm/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Media files -------------------------------------------------------
    location /media/ {
        alias /var/www/mi_crm/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- WebSocket: Warehouse Deliveries real-time feed -> Daphne (ASGI) ---
    # Gunicorn is WSGI and cannot upgrade a connection to WebSocket, so /ws/ goes
    # to Daphne on 127.0.0.1:8001. This prefix is longer than "location /", so
    # nginx routes /ws/ here and everything else to the gunicorn socket.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets are long-lived: do not time them out like normal requests.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- Everything else -> Django ----------------------------------------
    location / {
        proxy_pass http://unix:/run/gunicorn.sock;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- Block sensitive paths --------------------------------------------
    location ~ /\. {
        deny all;
    }

    location ~* \.(git|svn|env|htaccess|htpasswd) {
        deny all;
    }

    location ~* \.(bak|backup|old|orig|save|swp|tmp) {
        deny all;
    }

    # ---- Error pages -------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ===========================================================================
# SELINUX - required on Rocky 10, otherwise nginx starts but returns 502/403
# ===========================================================================
# nginx -t passing does NOT mean the site will work; SELinux blocks the socket
# and file access by default. Run these as root:
#
#   # 1. Allow nginx to connect to the Daphne WebSocket port (127.0.0.1:8001)
#   setsebool -P httpd_can_network_connect 1
#
#   # 2. Let nginx connect to the gunicorn unix socket in /run
#   semanage fcontext -a -t httpd_var_run_t "/run/gunicorn.sock"
#   restorecon -v /run/gunicorn.sock
#
#   # 3. Let nginx READ the collected static files and user media
#   semanage fcontext -a -t httpd_sys_content_t "/var/www/mi_crm/staticfiles(/.*)?"
#   semanage fcontext -a -t httpd_sys_content_t "/var/www/mi_crm/media(/.*)?"
#   restorecon -R -v /var/www/mi_crm/staticfiles /var/www/mi_crm/media
#
#   # 4. Confirm nothing is still denied
#   ausearch -m avc -ts recent | audit2allow -w
#
# If step 2 is awkward in your deploy, point gunicorn at a TCP socket instead
# (e.g. 127.0.0.1:8000) and use "proxy_pass http://127.0.0.1:8000;" - that only
# needs the httpd_can_network_connect boolean from step 1.
# ===========================================================================
