{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
  <h2>{{ title }}</h2>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% crispy form %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
